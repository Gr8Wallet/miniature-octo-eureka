const fsAnn=W=>Math.max(15,Math.min(30,W*0.0164));

function kontur(t,x,y,fs,col,align){
  ctx.save(); ctx.textAlign=align||'left'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,fs*0.26); ctx.strokeStyle='rgba(0,0,0,.82)';
  ctx.strokeText(t,x,y); ctx.fillStyle=col; ctx.fillText(t,x,y); ctx.restore();
}
function platte(t,x,y,fs,col,align){
  ctx.save(); ctx.font='700 '+fs+'px system-ui,sans-serif'; ctx.textBaseline='middle';
  const w=ctx.measureText(t).width, px=fs*0.42, py=fs*0.34;
  let bx=x; if(align==='center')bx=x-w/2; else if(align==='right')bx=x-w;
  ctx.fillStyle='rgba(0,0,0,.72)';
  rrect(bx-px,y-fs*0.62-py*0.1,w+px*2,fs*1.24+py*0.2,6); ctx.fill();
  ctx.textAlign='left'; ctx.fillStyle=col; ctx.fillText(t,bx,y); ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let OCC=null,OCW=0,OCH=0;
function occReset(g){ OCW=Math.ceil(g.W/10); OCH=Math.ceil(g.H/10); OCC=new Uint8Array(OCW*OCH); }
function occAdd(x,y,w,h){ if(!OCC)return; const x0=Math.max(0,Math.floor(x/10)),x1=Math.min(OCW-1,Math.ceil((x+w)/10));
  const y0=Math.max(0,Math.floor(y/10)),y1=Math.min(OCH-1,Math.ceil((y+h)/10));
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)OCC[j*OCW+i]=1; }
function occFree(x,y,w,h){ if(!OCC)return true; const x0=Math.max(0,Math.floor(x/10)),x1=Math.min(OCW-1,Math.ceil((x+w)/10));
  const y0=Math.max(0,Math.floor(y/10)),y1=Math.min(OCH-1,Math.ceil((y+h)/10));
  for(let j=y0;j<=y1;j++)for(let i=x0;i<=x1;i++)if(OCC[j*OCW+i])return false; return true; }

    const v=CURVE[i]; if(isNaN(v))continue; if(v<m)m=v; if(v>M)M=v; }
  return {min:isFinite(m)?m:NaN,max:isFinite(M)?M:NaN}; }

function render(now,F){
  F=F||{};

  if(cv.width!==Math.round(wW*dpr)||cv.height!==Math.round(wH*dpr)){
    cv.width=Math.round(wW*dpr); cv.height=Math.round(wH*dpr);
    cv.style.width=wW+'px'; cv.style.height=wH+'px';
  }
  S.W=wW; S.H=wH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(wW<80||wH<80){ ctx.fillStyle='#000'; ctx.fillRect(0,0,Math.max(1,wW),Math.max(1,wH)); return; }
  const g=geo(); calcY(g);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,g.W,g.H);
  occReset(g);
  PANR=null;   /* das Bedienfeld verschiebt keine Chart-Inhalte (03.09.2026) */
  /* feste Sperrflaeche fuer die Kopfzeile des Bedienfelds — konstant, unabhaengig
     davon, ob das Feld offen, zu oder verschoben ist */
  occAdd(6,6,334,52);

  const F2=Object.assign({
    barsA:0, chartA:1, priceP:1, markP:1, wipe:1, colorA:0, fokusA:1,
    grain:0, flash:0, bigText:null, bigSub:null, banner:null, fullText:null, camS:1, camX:0.5
  },F);

  /* --- Kamera nur auf der Datenebene --- */
  ctx.save();
  /* Kamerafahrt abgeschafft (03.09.2026): bei randlosem Datenfeld schneidet jede
     Vergroesserung oben und links ab. Bewegung kommt aus dem Zeitfenster, nicht aus dem Zoom. */

  GA=F2.chartA; ctx.globalAlpha=GA;
  achsen(g);
  kursLinie(g,F2);

  ctx.globalAlpha=1;
  ctx.restore();

  /* --- Vignette ueber den Daten --- */

  ctx.globalAlpha=F2.chartA*F2.fokusA;

  if(F2.fullText) vollText(g,F2.fullText,F2.fullA===undefined?1:F2.fullA);
  if(F2.bigText) grosseZahl(g,F2.bigText,F2.bigSub,F2.bigA===undefined?1:F2.bigA);
  if(F2.barsA>0) balken(g,F2.barsA);
  if(F2.grain>0) korn(g,F2.grain);
  if(F2.flash>0){ ctx.fillStyle='rgba(255,255,255,'+F2.flash+')'; ctx.fillRect(0,0,g.W,g.H); }

/* ---------- Achsen ---------- */
function achsen(g){
  const fs=fsAx(g.W);
  ctx.font='600 '+fs+'px system-ui,sans-serif';
  /* y: Zehnerpotenzen (bei kleiner Spanne zusaetzlich 2er/5er) */
  const lo=Math.log10(YLO), hi=Math.log10(YHI);
  const dec=hi-lo; const mults = dec>3.2?[1]:(dec>1.6?[1,3]:[1,2,5]);
  ctx.save(); ctx.globalAlpha=0.72*GA;
  for(let e=Math.floor(lo);e<=Math.ceil(hi);e++){
    for(const m of mults){
      const v=m*Math.pow(10,e); if(v<YLO*1.02||v>YHI*0.99)continue;
      const y=yOf(v,g);
      ctx.strokeStyle='rgba(255,255,255,.09)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(g.L,y); ctx.lineTo(g.R,y); ctx.stroke();
      const t = v>=1000? (v>=1e6? (v/1e6)+' Mio $' : (v/1000)+'.000 $') : (v>=1? v+' $' : v.toFixed(2).replace('.',',')+' $');
      const ly=Math.max(g.aT+fs*0.70,Math.min(g.aB-fs*0.70,y-fs*0.75));
      const lx=g.L+10;
      kontur(t,lx,ly,fs,'rgba(255,255,255,.92)','left');
      occAdd(lx-6,ly-fs*0.85,ctx.measureText(t).width+18,fs*1.7);
    }
  }
  ctx.restore();
  /* x: Jahre, Schrittweite aus gemessener Textbreite */
  const y0=Math.ceil(yfrac(S.t0)), y1=Math.floor(yfrac(T_RIGHT));
  const bw=ctx.measureText('2026').width+g.W*0.012;
  let step=1; while(step<64 && ((y1-y0)/step+1)*bw > g.W*0.78) step++;
  const first=Math.ceil(y0/step)*step;
  ctx.save(); ctx.globalAlpha=0.75*GA;
  for(let y=first;y<=y1;y+=step){
    const ts=Date.UTC(y,0,1)/1000, x=xOf(ts,g); if(x<g.L+4||x>g.R-4)continue;
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,g.aT); ctx.lineTo(x,g.aB); ctx.stroke();
    kontur(String(y),x,g.aB-fs*0.85,fs,'rgba(255,255,255,.92)','center');
    occAdd(x-bw/2,g.aB-fs*1.7,bw,fs*1.7);
  }
  ctx.restore();
  /* Trennlinie zur unteren Leiste (volle Breite) */
  ctx.save(); ctx.globalAlpha=.30*GA; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,Math.round(g.aB+g.H*0.012)+0.5); ctx.lineTo(g.W,Math.round(g.aB+g.H*0.012)+0.5); ctx.stroke(); ctx.restore();
}

/* ---------- Kurslinie: der Bitcoin-Preis ist das Hauptbild ---------- */
function kursLinie(g,F){
  const h=hK(), ppt=pxProTag(g);
  const i1=Math.max(0,iOf(S.t0)-30), i2=NP-1;
  const X=new Float64Array(NP), Y=new Float64Array(NP);
  for(let i=i1;i<=i2;i++){ X[i]=xOf(tsOfI(i),g); Y[i]=yOf(D.px[i],g); }
  const n1=Math.max(i1+1, Math.floor(i1+(i2-i1)*Math.min(1,F.priceP)));
  const L=liste(), gesamt=L.length;
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();
  ctx.lineJoin='round'; ctx.lineCap='round';

  /* ---- 1. die Lichtsaeulen: jedes Fenster wirft Farbe bis auf die Zeitachse ---- */
  const saeulen=[];
  for(let k=0;k<gesamt;k++){
    const e=L[k];
    const lp=Math.max(0,Math.min(1,(F.markP*gesamt - k*0.55)/1.0)); if(lp<=0)continue;
    if(e.i>n1)continue;
    const a=Math.max(i1,0,fensterVon(e,h)), b=Math.min(NP-1,n1,fensterBis(e,h)); if(b<=a)continue;
    const br=bremst(e,h), col=br?BL:OR, rgb=br?'90,200,250':'247,147,26';
    const stark=(e.typ!==0);          /* nur echte Aenderungen tragen Farbe im Kursverlauf */
    if(!stark){ saeulen.push({e,lp,br,col,a,b,stark}); continue; }
    /* kurzes Unterlicht statt Lichtsaeule bis zur Achse (03.09.2026):
       gibt der Linie Tiefe, ohne wie ein zweites Symbol zu wirken */
    let unten=-1e9; for(let i=a;i<=b;i++) if(Y[i]>unten)unten=Y[i];
    const band=Math.min(g.aB-unten,(g.aB-g.aT)*0.13);
    const x1=X[a], x2=Math.max(X[b],X[a]+5);
    const gr=ctx.createLinearGradient(0,unten,0,unten+band);
    gr.addColorStop(0,'rgba('+rgb+',0.34)');
    gr.addColorStop(1,'rgba('+rgb+',0)');
    ctx.save(); ctx.globalAlpha=lp*GA; ctx.fillStyle=gr;
    ctx.beginPath(); ctx.moveTo(x1,unten+band);
    for(let i=a;i<=b;i++) ctx.lineTo(X[i],Y[i]);
    ctx.lineTo(x2,unten+band); ctx.closePath(); ctx.fill();
    ctx.restore();
    saeulen.push({e,lp,br,col,a,b,stark});
  }

  /* ---- 1b. Unterlicht unter der ganzen Kurslinie: gibt dem Bild Tiefe ---- */
  {
    let tief=-1e9; for(let i=i1;i<=n1;i++) if(Y[i]>tief)tief=Y[i];
    const bo=Math.min(g.aB-tief,(g.aB-g.aT)*0.10);
    const gg=ctx.createLinearGradient(0,g.aT,0,g.aB);
    gg.addColorStop(0,'rgba(255,255,255,0.10)');
    gg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save(); ctx.globalAlpha=0.9*GA; ctx.fillStyle=gg;
    ctx.beginPath(); ctx.moveTo(X[i1],g.aB);
    for(let i=i1;i<=n1;i++) ctx.lineTo(X[i],Y[i]);
    ctx.lineTo(X[n1],g.aB); ctx.closePath(); ctx.fill(); ctx.restore();
  }

  /* ---- 2. die Grundlinie ---- */
  if(true){
    /* Die Einfaerbung der Kurslinie: die Linie selbst zeigt, wie stark die Zinskurve
       Bitcoins Bewegung noch erklaert. Hell = sie traf zusammen, grau = Rauschen.
       Kein Orange und kein Blau, damit die Farbsemantik der anderen Stufen gilt. */
    /* die Jahre, fuer die es noch kein Drei-Jahres-Fenster gibt: gedaempft, damit
       die Kurve nicht abgeschnitten wirkt — dort ist nichts gemessen, nicht nichts passiert */
    let iM=n1; for(let k=0;k<KOPI.length;k++){ if(KOPI[k][1]!==null){ iM=Math.min(n1,KOPI[k][0]); break; } }
    if(iM>i1+1){
      ctx.save(); ctx.globalAlpha=0.52*GA; ctx.strokeStyle='rgba(168,168,170,.95)'; ctx.lineWidth=3.4;
      ctx.setLineDash([7,7]);
      ctx.beginPath(); ctx.moveTo(X[i1],Y[i1]);
      for(let i=i1+1;i<=iM;i++) ctx.lineTo(X[i],Y[i]);
      ctx.stroke(); ctx.setLineDash([]); ctx.restore();
    }
    for(let k=1;k<KOPI.length;k++){
      const a=KOPI[k-1][0], b=KOPI[k][0]; if(b<i1||a>n1)continue;
      const v=KOPI[k][1]; if(v===null)continue;
      const st=Math.max(0,Math.min(1,v/D.kopMax.v));
      /* Untergrenze so hoch, dass die Kurslinie ueberall lesbar bleibt — der
         Unterschied hell/grau traegt die Aussage, das Verschwinden nicht. */
      /* Zwei Mittel tragen dieselbe Aussage: Helligkeit UND Staerke.
         Die Staerke war mit 3,8–6,0 px zu fein, um als Indikator gelesen zu werden;
         jetzt 2,8–10,4 px, also Faktor 3,7 statt 1,6. */
      const hell=Math.round(180+75*st), al=0.86+0.14*st;
      ctx.save(); ctx.globalAlpha=al*GA;
      ctx.strokeStyle='rgb('+hell+','+hell+','+Math.round(hell*(0.97+0.03*st))+')';
      ctx.lineWidth=2.8+7.6*st;
      if(st>0.35){ ctx.shadowBlur=20*st; ctx.shadowColor='rgba(255,255,255,.62)'; }
      ctx.beginPath(); ctx.moveTo(X[Math.max(i1,a)],Y[Math.max(i1,a)]);
      for(let i=Math.max(i1,a)+1;i<=Math.min(b,n1);i++) ctx.lineTo(X[i],Y[i]);
      ctx.stroke(); ctx.restore();
    }
    ctx.shadowBlur=0;
  } else {
    for(let pass=0;pass<2;pass++){
      ctx.strokeStyle=WH; ctx.lineWidth=4.4;
      ctx.shadowBlur=pass===0?16:0; ctx.shadowColor='rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.moveTo(X[i1],Y[i1]);
      for(let i=i1+1;i<=n1;i++) ctx.lineTo(X[i],Y[i]);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
  }

  /* ---- 3. die Fenster selbst, in die Kurslinie hineingelegt ---- */
  ENDS=[];
  for(const s of saeulen){
    const e=s.e;
    if(false){
      const v0=Math.max(i1,e.i-h);
      ctx.save();
      for(let pass=0;pass<2;pass++){
        ctx.globalAlpha=s.lp*(pass===0?0.30:0.98)*GA; ctx.strokeStyle=WH;
        ctx.lineWidth=pass===0?Math.max(10,4.4+ppt*1.4):5.4;
        ctx.beginPath(); ctx.moveTo(X[v0],Y[v0]);
        for(let i=v0+1;i<=e.i;i++) ctx.lineTo(X[i],Y[i]);
        ctx.stroke();
      }
      ctx.restore();
    }
    if(!s.stark){ ENDS.push({e,lp:s.lp,br:s.br,col:s.col,voll:false,
      xa:X[e.i],ya:Y[e.i],xb:X[s.b],yb:Y[s.b]}); continue; }
    ctx.save();
    for(let pass=0;pass<2;pass++){
      ctx.globalAlpha=s.lp*(pass===0?0.32:1)*GA; ctx.strokeStyle=s.col;
      ctx.lineWidth=pass===0?Math.max(11,4.4+ppt*1.6):5.8;
      ctx.beginPath(); ctx.moveTo(X[s.a],Y[s.a]);
      for(let i=s.a+1;i<=s.b;i++) ctx.lineTo(X[i],Y[i]);
      ctx.stroke();
    }
    ctx.restore();
    ENDS.push({e,lp:s.lp,br:s.br,col:s.col,xa:X[e.i],ya:Y[e.i],xb:X[s.b],yb:Y[s.b],
               voll:true});
  }
  ctx.restore();

  /* Belegung merken (fuer die Freiflaechen-Suche) */
  CURVE=new Float32Array(Math.max(1,Math.ceil(g.W))); CURVE.fill(NaN);
  for(let i=i1;i<=n1;i++){ occAdd(X[i]-6,Y[i]-9,12,18);
    const xi=Math.round(X[i]); if(xi>=0&&xi<CURVE.length) CURVE[xi]=isNaN(CURVE[xi])?Y[i]:Math.min(CURVE[xi],Y[i]); }
  let letzte=NaN;
  for(let i=0;i<CURVE.length;i++){ if(!isNaN(CURVE[i]))letzte=CURVE[i]; else CURVE[i]=letzte; }

  /* Puls am letzten Kurspunkt */
  if(F.priceP>=1){
    ctx.save(); ctx.globalAlpha=GA;
    const ph=(performance.now()%4000)/4000, r=6.4+7*ph;
    ctx.strokeStyle='rgba(255,255,255,'+(0.55*(1-ph))+')'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.arc(X[i2],Y[i2],r,0,7); ctx.stroke();
    ctx.fillStyle=WH; ctx.beginPath(); ctx.arc(X[i2],Y[i2],6.4,0,7); ctx.fill();
    ctx.restore();
  }
}

/* ---------- Marken, Sollpunkte, Ausnahme ---------- */
let ENDS=[];
function marken(g,F){
  const h=hK(), fsA=fsAnn(g.W), fsL=fsLab(g.W), ppt=pxProTag(g);
  ctx.save();
  ctx.beginPath(); ctx.rect(g.L,g.aT,g.R-g.L,g.aB-g.aT); ctx.clip();

  for(const p of ENDS){
    const e=p.e;
    if(p.xa<g.L-40||p.xa>g.R+40) continue;
    /* --- EIN Symbol je Zinsentscheid (03.09.2026): Dreieck hoch = Anhebung,
           Dreieck runter = Senkung, Querstrich = Termin ohne Aenderung.
           Die Farbe sagt, was der Kurs danach getan hat:
           orange = staerker als ueblich, blau = schwaecher.
           Sollpunkt, Endpunkt und Verbindungsbalken sind ersatzlos gestrichen. --- */
    /* Groesse folgt dem Zinsschritt; Termine ohne Aenderung bleiben klein und ruhig,
       damit die 100 Kontrollpunkte die 31 Aenderungen nicht erschlagen */
    const gr0=Math.max(fsL*0.46, Math.min(fsL*0.78, 8+fsL*0.20));
    const rr=e.typ===0 ? gr0*0.46 : gr0*(0.82+0.72*Math.min(1,Math.abs(e.s)/0.5));
    ctx.save(); ctx.globalAlpha=p.lp*GA*(e.typ===0?0.72:1);
    ctx.fillStyle='rgba(0,0,0,.88)';
    ctx.beginPath(); ctx.arc(p.xa,p.ya,rr*1.22,0,7); ctx.fill();
    ctx.fillStyle=p.col; ctx.shadowBlur=e.typ===0?6:20; ctx.shadowColor=p.col;
    ctx.beginPath();
    if(e.typ>0){       ctx.moveTo(p.xa,p.ya-rr); ctx.lineTo(p.xa+rr*0.92,p.ya+rr*0.72); ctx.lineTo(p.xa-rr*0.92,p.ya+rr*0.72); ctx.closePath(); }
    else if(e.typ<0){  ctx.moveTo(p.xa,p.ya+rr); ctx.lineTo(p.xa+rr*0.92,p.ya-rr*0.72); ctx.lineTo(p.xa-rr*0.92,p.ya-rr*0.72); ctx.closePath(); }
    else {             ctx.rect(p.xa-rr*0.80,p.ya-rr*0.30,rr*1.60,rr*0.60); }
    ctx.fill(); ctx.shadowBlur=0;
    ctx.restore();
    occAdd(p.xa-rr*1.4,p.ya-rr*1.4,rr*2.8,rr*2.8);
  }
  ctx.restore();

}

/* ---------- Fokusblock: Kopfzeile, eine grosse Zahl, ein Etikett ---------- */
function fokus(g){
  const h=hK(), z=zaehl();
  let kopf,zahl,lab,col=BL;
  kopf='WHEN THE FED MOVES RATES';
  zahl=z.kAend+' OF '+z.nAend;
  lab=(S.richtung==='vor'?'WEAKER THAN USUAL BEFORE':'WEAKER THAN USUAL AFTERWARDS')
      +'  ·  NO CHANGE: ONLY '+z.ku+' OF '+z.nu;
  const fsK=Math.max(13,Math.min(23,g.W*0.0126));
  const fsZ=Math.max(34,Math.min(88,g.W*0.0530));
  const fsL=Math.max(14,Math.min(27,g.W*0.0152));
  ctx.font='800 '+fsZ+'px system-ui,sans-serif';
  const wZ=ctx.measureText(zahl).width;
  ctx.font='700 '+fsK+'px system-ui,sans-serif';
  const wK=ctx.measureText(kopf).width;
  ctx.font='700 '+fsL+'px system-ui,sans-serif';
  const wL=ctx.measureText(lab).width;
  const bw=Math.max(wZ,wK,wL)+26;
  const bh=fsK*1.5+fsZ*1.30+fsL*1.5+10;
  const kx=[]; for(let f=0.02;f<=0.99;f+=0.035){ const xx=g.W*f; if(xx+bw<g.W-g.W*0.012) kx.push(xx); }
  let bx=kx[0], by=g.aT+(g.aB-g.aT)*0.06, best=1e9;
  for(let f=0.02;f<=0.80;f+=0.03){
    const cy=g.aT+(g.aB-g.aT)*f; if(cy+bh>g.aB-6)continue;
    for(const xx of kx){
      let c=occLast(xx-10,cy-10,bw+20,bh+20);
      c+= (cy > g.aT+(g.aB-g.aT)*0.52 ? 3 : 0);
      if(c<best){best=c;bx=xx;by=cy; if(c===0){f=99;break;}}
    }
  }
  ctx.save();
  let y=by+fsK*0.7;
  ctx.font='700 '+fsK+'px system-ui,sans-serif';
  kontur(kopf,bx,y,fsK,'rgba(255,255,255,.72)','left'); y+=fsK*1.4;
  ctx.font='800 '+fsZ+'px system-ui,sans-serif';
  y+=fsZ*0.66;
  ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.shadowBlur=26;

}

/* ---------- untere Leiste ---------- */
function leiste(g,F){
  const fs=fsBar(g.W), h=hK();
  wortmarke(g, g.W*0.012, (g.bar1+g.bar2)/2, Math.max(74,g.W*0.072));
  if(!S.texte) return;
  const x0=g.W*0.012+Math.max(74,g.W*0.072)+g.W*0.022;
  const rechtsFrei=g.W-330-x0;
  ctx.font='700 '+fs+'px system-ui,sans-serif';
  let x=x0;
  const leg=[['w',OR,'stronger'],['w',BL,'weaker'],
       ['a','rgba(255,255,255,.93)','hike'],['b','rgba(255,255,255,.93)','cut'],
       ['c','rgba(255,255,255,.93)','no change'],
       ['d','rgba(255,255,255,.96)','thick and bright = the yield curve fit']];
  for(const [sym,col,txt] of leg){
    const w=ctx.measureText(txt).width+fs*2.6+g.W*0.018;
    if(x+w>x0+rechtsFrei)break;
    ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=fs*0.34; ctx.lineCap='round';
    const cxm=x+fs*0.7, r=fs*0.52;
    if(sym==='w'){ ctx.beginPath(); ctx.moveTo(x,g.bar1); ctx.lineTo(x+fs*1.5,g.bar1); ctx.stroke(); }
    else if(sym==='d'){ /* duenn nach dick, damit die Staerke selbst in der Legende steht */
      ctx.lineWidth=fs*0.20; ctx.beginPath(); ctx.moveTo(x,g.bar1); ctx.lineTo(x+fs*0.75,g.bar1); ctx.stroke();
      ctx.lineWidth=fs*0.62; ctx.beginPath(); ctx.moveTo(x+fs*0.80,g.bar1); ctx.lineTo(x+fs*1.6,g.bar1); ctx.stroke(); }
    else if(sym==='a'){ ctx.beginPath(); ctx.moveTo(cxm,g.bar1-r); ctx.lineTo(cxm+r*0.92,g.bar1+r*0.72); ctx.lineTo(cxm-r*0.92,g.bar1+r*0.72); ctx.closePath(); ctx.fill(); }
    else if(sym==='b'){ ctx.beginPath(); ctx.moveTo(cxm,g.bar1+r); ctx.lineTo(cxm+r*0.92,g.bar1-r*0.72); ctx.lineTo(cxm-r*0.92,g.bar1-r*0.72); ctx.closePath(); ctx.fill(); }
    else { ctx.fillRect(cxm-r*0.80,g.bar1-r*0.30,r*1.60,r*0.60); }
    ctx.restore();
    kontur(txt,x+fs*2.0,g.bar1,fs,'rgba(255,255,255,.86)','left');
    x+=w;
  }
  const ab=h+(S.richtung==='vor'?' DAYS BEFORE':' DAYS AFTER')+'  ·  USUAL '+pct(medW(h),1)
    +'  ·  YIELD CURVE EXPLAINS '+num(D.kopNow.v*100,1)+' %  (2023: '+num(D.kopMax.v*100,0)+' %)';
  ctx.font='800 '+fs*1.04+'px system-ui,sans-serif';
  kontur(ab,x0,g.bar2,fs*1.04,'rgba(255,255,255,.92)','left');
}

function wortmarke(g,x,yMid,w){
  /* Verhaeltnisse fest, nicht pro Episode neu entscheiden:
     Schriftgroesse 0,26 x Zielbreite, Zeilenabstand 0,90 x Schriftgroesse.
     Damit liegt die Waagerecht-Dehnung bei rund 1,15 (Zeile 1) und 1,09 (Zeile 2) —
     die Wortmarke ist breiter als hoch und wirkt nicht nach oben gestreckt. */
  const h1=w*0.26, pitch=h1*0.90;
  ctx.save(); ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.font='900 '+h1+'px system-ui,sans-serif';
  const wA=ctx.measureText('GREAT').width;
  const wB1=ctx.measureText('WALL').width, wB2=ctx.measureText('Y').width;
  const y1=yMid-pitch/2, y2=yMid+pitch/2;
  ctx.save(); ctx.translate(x,y1); ctx.scale(w/wA,1);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillText('GREAT',0,0); ctx.restore();
  const sc=w/(wB1+wB2);
  ctx.save(); ctx.translate(x,y2); ctx.scale(sc,1);
  ctx.fillStyle=OR; ctx.fillText('WALL',0,0);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fillText('Y',wB1,0); ctx.restore();
  ctx.restore();
}
function vignette(g){
  const r=Math.max(g.W,g.H)*0.78;
  const gr=ctx.createRadialGradient(g.W*0.5,g.H*0.46,r*0.36,g.W*0.5,g.H*0.46,r);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.58)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,g.W,g.H);
}

function balken(g,a){

let KORN=null;
function korn(g,a){
  if(!KORN){ const c=document.createElement('canvas'); c.width=c.height=170;
    const x=c.getContext('2d'), im=x.createImageData(170,170);
    for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
    x.putImageData(im,0,0); KORN=c; }
  ctx.save(); ctx.globalAlpha=a*0.13; ctx.globalCompositeOperation='overlay';
  for(let y=0;y<g.H;y+=170)for(let x=0;x<g.W;x+=170)ctx.drawImage(KORN,x,y);
  ctx.restore();
}
function teile(t){ /* *...* -> orange */
  const out=[]; let i=0,cur='',on=false;
  while(i<t.length){ if(t[i]==='*'){ if(cur)out.push([cur,on]); cur=''; on=!on; i++; }
    else { cur+=t[i]; i++; } }
  if(cur)out.push([cur,on]); return out;
}
function vollText(g,txt,a){
  const lines=txt.split('\n');
  let fs=Math.min(g.W*0.052,g.H*0.085);
  ctx.font='900 '+fs+'px system-ui,sans-serif';
  let mx=0; for(const l of lines) mx=Math.max(mx,ctx.measureText(l.replace(/\*/g,'')).width);
  while(mx>g.W*0.84 && fs>16){ fs*=0.94; ctx.font='900 '+fs+'px system-ui,sans-serif';
    mx=0; for(const l of lines) mx=Math.max(mx,ctx.measureText(l.replace(/\*/g,'')).width); }
  ctx.save(); ctx.globalAlpha=a;
  const gy=g.H*0.42, lh=fs*1.24, y0=gy-(lines.length-1)*lh/2;
  ctx.font='900 '+fs+'px system-ui,sans-serif'; ctx.textBaseline='middle';
  lines.forEach((l,i)=>{
    const seg=teile(l); let w=0; for(const [s] of seg) w+=ctx.measureText(s).width;
    let x=g.W/2-w/2; const y=y0+i*lh;
    for(const [s,on] of seg){
      ctx.lineJoin='round'; ctx.lineWidth=fs*0.20; ctx.strokeStyle='rgba(0,0,0,.85)';
      ctx.textAlign='left'; ctx.strokeText(s,x,y);
      ctx.fillStyle=on?OR:WH; ctx.fillText(s,x,y); x+=ctx.measureText(s).width;
    }
  });
  ctx.restore();
}
function banner(g,txt,a){
  const [lab,zeile]=txt;
  const fsL=Math.max(13,Math.min(24,g.W*0.0125)), fsZ=Math.max(17,Math.min(34,g.W*0.0192));
  const y=g.H*0.085;
  const gr=ctx.createLinearGradient(0,y-fsZ*2.6,0,y+fsZ*2.8);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(.45,'rgba(0,0,0,.70)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=gr; ctx.fillRect(0,y-fsZ*2.6,g.W,fsZ*5.4);
  ctx.font='800 '+fsL+'px system-ui,sans-serif';
  kontur(lab,g.W/2,y-fsZ*0.85,fsL,'rgba(247,147,26,.95)','center');
  let fs=fsZ; ctx.font='800 '+fs+'px system-ui,sans-serif';
  while(ctx.measureText(zeile.replace(/\*/g,'')).width>g.W*0.86&&fs>14){fs*=0.94;ctx.font='800 '+fs+'px system-ui,sans-serif';}
  const seg=teile(zeile); let w=0; for(const [s] of seg)w+=ctx.measureText(s).width;
  let x=g.W/2-w/2; ctx.textBaseline='middle';
  for(const [s,on] of seg){ ctx.lineJoin='round'; ctx.lineWidth=fs*0.22; ctx.strokeStyle='rgba(0,0,0,.85)';
    ctx.textAlign='left'; ctx.strokeText(s,x,y+fs*0.45); ctx.fillStyle=on?OR:WH; ctx.fillText(s,x,y+fs*0.45);
    x+=ctx.measureText(s).width; }
  ctx.restore();
}
function grosseZahl(g,t,sub,a){

/* ===================== Sequenz S+T ===================== */
const CIN={start:0,dauer:40000,sichern:null};
const T_ZOOM = Date.UTC(2024,3,1)/1000;      /* Ziel der Kernszene */
function hookBeats(){
  const c=D.cnt[20];
  return [
    'RATES *DOWN*\nPRICE *UP*',
    'THAT IS WHAT *EVERYONE SAYS*',
    'BITCOIN HAS SEEN *'+c[3]+'* CUTS\n*'+c[2]+' TIMES* IT WAS WEAKER AFTERWARDS',
    'ALL THAT COUNTS IS WHETHER RATES *MOVE*\nNO CHANGE: *COIN FLIP*'
  ];
}
function frameFor(ms){
  const F={}; const t=ms/1000;
  const beats=hookBeats();
  const ease=x=>x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2;
  const c20=D.cnt[20];
  if(t<18.4){
    /* 4,60 s je Beat, Blenden 0,45 s -> rund 3,7 s bei voller Deckkraft */
    const BE=4.60, BL=0.45;
    F.barsA=1; F.chartA=0;
    F.grain=0.35+0.5*Math.min(1,t/9.2)*(t<9.2?1:Math.max(0,(13.8-t)/4.6));
    const i=Math.min(3,Math.floor(t/BE)), lt=t-i*BE;
    F.fullText=beats[i];
    F.fullA=Math.min(1,lt/BL)*Math.min(1,(BE-lt)/BL);
    if(t>=9.2&&t<9.7) F.flash=1-(t-9.2)/0.5;
    F.zeige='aend'; F.h=20; F.t0=T_MIN;
  } else if(t<22.6){
    const p=(t-18.4)/4.2;
    F.barsA=1-ease(Math.min(1,p*1.6)); F.chartA=1; F.priceP=ease(p);
    F.markP=0; F.zeige='aend'; F.h=20; F.t0=T_MIN; F.grain=0.12;
    F.banner=['BITCOIN SINCE 2010',
      '*'+D.ev.length+'* Fed meetings sit inside this price line'];
    F.bannerA=Math.min(1,(t-18.7)/0.5);
    /* keine Vergroesserung: das Feld laeuft randlos, es gibt nichts zu verschenken */
  } else if(t<26.2){
    const p=(t-22.6)/3.6;
    F.barsA=0; F.chartA=1; F.priceP=1; F.markP=ease(p); F.zeige='aend'; F.h=20; F.t0=T_MIN; F.grain=0.10;
    F.banner=['THE FED MOVES RATES',
      'afterwards Bitcoin was weaker than usual *'+(c20[2]+c20[4])+' of '+(c20[3]+c20[5])+'* times'];
    F.bannerA=Math.min(1,p*3);

  } else if(t<32.6){
    const p=(t-26.2)/6.4;
    F.barsA=0; F.chartA=1; F.priceP=1; F.markP=1; F.zeige='alle'; F.h=20; F.grain=0.10;
    /* Kernszene: dieselbe Frage an die Termine, an denen die Fed nichts getan hat */
    const q=ease(Math.min(1,Math.max(0,(p-0.28)/0.62)));
    F.t0=T_MIN+(T_ZOOM-T_MIN)*q;
    F.banner=['AND WHEN IT CHANGES NOTHING?',
      '*'+c20[6]+' of '+c20[7]+'* — a *COIN FLIP*'];
    F.bannerA=Math.min(1,(t-26.4)*3);

  } else if(t<36.4){
    const p=(t-32.6)/3.8;
    F.barsA=ease(Math.min(1,p*2.2))*0.55; F.chartA=0.35; F.priceP=1; F.markP=1;
    F.zeige='alle'; F.h=20; F.t0=T_ZOOM; F.fokusA=0; F.grain=0.14;
    F.bigText=(c20[2]+c20[4])+' OF '+(c20[3]+c20[5]);
    F.bigSub='THAT IS HOW OFTEN BITCOIN WAS WEAKER THAN USUAL · NO CHANGE: ONLY '+c20[6]+' OF '+c20[7];
    F.bigA=Math.min(1,p*4)*Math.min(1,(1-p)*5+0.4);
  } else {
    const p=(t-36.4)/3.6;
    F.barsA=Math.max(0,0.55-0.55*ease(Math.min(1,p*1.6))); F.chartA=1; F.priceP=1; F.markP=1;
    F.zeige='alle'; F.h=20; F.grain=0.08;
    F.t0=T_ZOOM+(T_MIN-T_ZOOM)*ease(Math.min(1,p*1.7));
    F.banner=['AND THE YIELD CURVE?',
      'it once explained *'+num(D.kopMax.v*100,0)+' %* of Bitcoin — today *'+num(D.kopNow.v*100,1)+' %*'];
    F.bannerA=Math.min(1,p*3)*Math.min(1,(1-p)*6+0.3);
  }
  return F;
}

let RAF=null;
function loop(){
  RAF=requestAnimationFrame(loop);
  if(CIN.start){
    const ms=performance.now()-CIN.start;
    if(ms>=CIN.dauer){ stopCin(); return; }
    const F=frameFor(ms);
    const alt=S.zeige, altT=S.t0, altH=S.h;
    if(F.zeige)S.zeige=F.zeige;
    if(F.t0)S.t0=F.t0;
    if(F.h)S.h=F.h;
    render(performance.now(),F);
    S.zeige=alt; S.t0=altT; S.h=altH;
  } else {
    render(performance.now(),{});
  }
}
function sichern(){ CIN.sichern={zeige:S.zeige,t0:S.t0,h:S.h,marken:S.marken,texte:S.texte,richtung:S.richtung}; }
function zurueck(){ if(CIN.sichern){ S.zeige=CIN.sichern.zeige; S.t0=CIN.sichern.t0; S.h=CIN.sichern.h;
  S.marken=CIN.sichern.marken; S.texte=CIN.sichern.texte; S.richtung=CIN.sichern.richtung;
  CIN.sichern=null; syncUI(); } }

   animation ausgeblendet werden" — die Sequenz zeigt Marken, aber keine Textfelder.
   Banner und grosse Zahl der Sequenz tragen die Aussage allein. */

    '<div><b style="color:#fff">'+num(p,p<10?4:0)+' $</b></div>'+z;
  tt.style.display='block';
  tt.style.left=Math.min(window.innerWidth-tt.offsetWidth-12,e.clientX+16)+'px';
  tt.style.top=Math.min(window.innerHeight-tt.offsetHeight-12,e.clientY+16)+'px';
});
cv.addEventListener('mouseleave',()=>tt.style.display='none');

/* Teilen */
(function(){
  const titel='After '+(D.cnt[20][2]+D.cnt[20][4])+' of '+(D.cnt[20][3]+D.cnt[20][5])
    +' Fed rate changes Bitcoin was weaker than usual — after meetings with no change only '
    +D.cnt[20][6]+' of '+D.cnt[20][7]+'. All 131 Fed meetings since 2010, recomputed.';
  function ziel(){ const h=location.href; return (h.length>2000||h.indexOf('data:')===0)?'':h; }
  function fallback(txt){ try{ navigator.clipboard.writeText(txt); }catch(_){ } }
  function bind(sel,mk){
    const a=document.querySelector(sel);
    a.addEventListener('click',ev=>{ ev.preventDefault();
      const u=ziel(), url=mk(u);
      const sp=a.querySelector('span'), alt=sp.textContent;
      if(!url){ fallback(titel+(u?' '+u:'')); sp.textContent='Text copied ✓'; setTimeout(()=>sp.textContent=alt,1800); return; }
      const w=window.open(url,'_blank','noopener,noreferrer');
      if(!w){ fallback(titel+(u?' '+u:'')); sp.textContent='Text copied ✓'; setTimeout(()=>sp.textContent=alt,1800); }
    });
    a.setAttribute('href',mk(ziel())||'#');
  }
  bind('#srl a.wa',u=>'https://wa.me/?text='+encodeURIComponent(titel+(u?' '+u:'')));
  bind('#srl a.xx',u=>'https://x.com/intent/post?text='+encodeURIComponent(titel)+(u?'&url='+encodeURIComponent(u):''));
  bind('#srl a.yt',()=> 'https://www.youtube.com/@WalletGreat');
  const lk=document.querySelector('#srl a.lk');
  lk.addEventListener('click',ev=>{ ev.preventDefault(); const u=ziel();
    fallback(u||titel); const sp=lk.querySelector('span'), alt=sp.textContent;
    sp.textContent='Copied ✓'; setTimeout(()=>sp.textContent=alt,1800); });
})();

/* Start */
syncUI(); stufeSetzen(1); loop();
window.addEventListener('resize',()=>{});
</script>
