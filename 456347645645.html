const SHOCKS = [
 {year:1974, label:"Oil Shock"},
 {year:1979, label:"Iran Crisis"},
 {year:1990, label:"Gulf War"},
 {year:2022, label:"COVID Inflation"},
];

// State
let S = {show1:true,show2:true,show3:true,show4:true,show5:false, y1:1948,y2:2024,base:1948};

// Per-layer 4s tween
const ANIM_LAYER_MS = 4000;
const layerAnim  = {1:1, 2:1, 3:1, 4:1, 5:0};
const layerTween = {
    1:{start:1, target:1, t0:0}, 2:{start:1, target:1, t0:0},
    3:{start:1, target:1, t0:0}, 4:{start:1, target:1, t0:0},
    5:{start:0, target:0, t0:0}
};
function setLayer(i, on) {
    S['show'+i] = on;
    const tw = layerTween[i];
    tw.start = layerAnim[i];
    tw.target = on ? 1 : 0;
    tw.t0 = performance.now();
}
function updateLayerAnim() {
    for (let i = 1; i <= 5; i++) {
        const tw = layerTween[i];
        if (layerAnim[i] === tw.target) continue;
        const t = Math.min(1, (performance.now() - tw.t0) / ANIM_LAYER_MS);
        const e = easeInOut(t);
        layerAnim[i] = tw.start + (tw.target - tw.start) * e;
        if (t >= 1) layerAnim[i] = tw.target;
    }
}

let animActive = true;
let animStart = performance.now();
const ANIM_DURATION = 30000;

const canvas = document.getElementById('chart');
const ctx    = canvas.getContext('2d');
const DPR    = window.devicePixelRatio || 1;

const RAW_MAP = {};
RAW.forEach(d => RAW_MAP[d.y] = d);

function reindex(base) {
    const b = RAW_MAP[base] || RAW[0];
    return RAW.map(d => ({year:d.y, w:(d.w/b.w)*100, p:(d.p/b.p)*100}));
}

let mx = -1, my = -1;
const PARTICLES = [];
function initParticles() {
    PARTICLES.length = 0;
    const N = Math.min(60, Math.floor((innerWidth * innerHeight) / 25000));
    for (let i = 0; i < N; i++) {
        PARTICLES.push({
            x: Math.random()*innerWidth, y: Math.random()*innerHeight,
            vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
            r: Math.random()*1.4+0.4, twinkle: Math.random()*Math.PI*2
        });
    }
}
function resize() {
    canvas.width  = innerWidth  * DPR;
    canvas.height = innerHeight * DPR;
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    initParticles();
}
resize();
addEventListener('resize', resize);
initParticles();

document.addEventListener('mousemove', e => { if (!dragging) { mx = e.clientX; my = e.clientY; } });
canvas.addEventListener('touchstart', e => { const t=e.touches[0]; mx=t.clientX; my=t.clientY; }, {passive:true});
canvas.addEventListener('touchmove',  e => { const t=e.touches[0]; mx=t.clientX; my=t.clientY; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend',   () => { mx=-1; my=-1; document.getElementById('tooltip').classList.remove('show'); });
canvas.addEventListener('mouseleave', () => { mx=-1; my=-1; document.getElementById('tooltip').classList.remove('show'); });

const panel = document.getElementById('panel');
const hdr   = document.getElementById('panelHeader');
let dragging = false, ox = 0, oy = 0;
hdr.addEventListener('mousedown', e => {

    S.y1 = 1948; S.y2 = 2024; S.base = 1948;
    document.getElementById('sld1').value = 1948;
    document.getElementById('sld2').value = 2024;
    document.getElementById('sld3').value = 1948;
    document.getElementById('lbl1').textContent = 1948;

function startAnimation() { animActive = true; animStart = performance.now(); }

// Share
function buildShareUrl() {

const SHARE_TITLE = 'The Great Divergence: U.S. Wages vs. Productivity, 1948–2024';

// ============================================================
// DRAW
// ============================================================
function draw() {
    updateLayerAnim();
    const W = innerWidth, H = innerHeight;
    const isMobile = W < 768;
    const Lw = layerAnim[1], Lp = layerAnim[2], Lg = layerAnim[3], Lm = layerAnim[4], Linf = layerAnim[5];

    const m = isMobile
        ? {top:60, right:30, bottom: H * 0.45 + 30, left:60}
        : {top:130, right:180, bottom:100, left:90};
    const cw = W - m.left - m.right;
    const ch = H - m.top - m.bottom;
    const x0 = m.left, y0 = m.top + ch;

    let progress = animActive ? Math.min(1, (performance.now() - animStart) / ANIM_DURATION) : 1;
    if (progress >= 1) animActive = false;

    const pAxes     = subProg(0.05, 0.22, progress);
    const pYlabels  = subProg(0.10, 0.20, progress);
    const pXlabels  = subProg(0.15, 0.25, progress);
    const pWages    = subProg(0.22, 0.45, progress);
    const pProd     = subProg(0.32, 0.58, progress);
    const pGap      = subProg(0.50, 0.70, progress);
    const pMileston = subProg(0.65, 0.82, progress);
    const pTitle    = subProg(0.75, 0.95, progress);
    const pEndDots  = subProg(0.85, 1.00, progress);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Aurora
    const auroraGrad = ctx.createRadialGradient(W*0.6, H+100, 0, W*0.6, H+100, H*0.9);
    auroraGrad.addColorStop(0, 'rgba(247,147,26,0.10)');
    auroraGrad.addColorStop(0.4, 'rgba(247,147,26,0.04)');
    auroraGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = auroraGrad;
    ctx.fillRect(0, 0, W, H);

    // Particles
    const now = performance.now();
    ctx.save();
    PARTICLES.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x<0) p.x=W; else if (p.x>W) p.x=0;
        if (p.y<0) p.y=H; else if (p.y>H) p.y=0;
        const tw = 0.4 + 0.6 * (Math.sin(now/800 + p.twinkle)*0.5 + 0.5);
        const grd = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y, p.r*5);
        grd.addColorStop(0, `rgba(247,147,26,${0.55*tw})`);
        grd.addColorStop(1, 'rgba(247,147,26,0)');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(p.x,p.y, p.r*5, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    // Data
    const allIndexed = reindex(S.base);
    const filtered = allIndexed.filter(d => d.year >= S.y1 && d.year <= S.y2);
    if (filtered.length < 2) return;

    const minYear = filtered[0].year, maxYear = filtered[filtered.length-1].year;
    const yearSpan = maxYear - minYear || 1;

    const allW = filtered.map(d=>d.w), allP = filtered.map(d=>d.p);
    const dataMin = Math.min(...allW, ...allP);
    const dataMax = Math.max(...allW, ...allP);
    const pad  = (dataMax - dataMin) * 0.12;
    const yMin = dataMin - pad;
    const yMax = dataMax + pad;
    const yRange = yMax - yMin;

    const xP = yr  => x0 + (yr - minYear) / yearSpan * cw;
    const yP = val => y0 - (val - yMin) / yRange * ch;

    const rawStep    = (yMax - yMin) / 5;
    const tickStep   = Math.ceil(rawStep / 25) * 25;
    const tickStart  = Math.ceil(yMin / tickStep) * tickStep;
    const labelMaxN = Math.max(3, Math.floor(cw / (isMobile ? 80 : 110)));
    const rawXStep  = yearSpan / labelMaxN;
    const xStep     = rawXStep <= 1 ? 1 : rawXStep <= 2 ? 2 : rawXStep <= 5 ? 5 : rawXStep <= 10 ? 10 : rawXStep <= 20 ? 20 : 25;

    // Gridlines
    ctx.save();
    ctx.globalAlpha = pAxes;
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let v = tickStart; v <= yMax; v += tickStep) {
        const yp = yP(v);
        ctx.beginPath(); ctx.moveTo(x0, yp); ctx.lineTo(x0+cw, yp); ctx.stroke();
    }
    for (let y = Math.ceil(minYear/xStep)*xStep; y <= maxYear; y += xStep) {
        const xp = xP(y);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        ctx.beginPath(); ctx.moveTo(xp, m.top); ctx.lineTo(xp, y0); ctx.stroke();
    }
    ctx.restore();

    // INFLATION BARS (L→R wavefront when layer toggles)
    if (Linf > 0.001) {
        const infMin = -2, infMax = 16;
        const infRange = infMax - infMin;
        const yI = pct => y0 - (pct - infMin) / infRange * ch;
        const pxPerYear = cw / yearSpan;
        const barW = Math.max(2, pxPerYear * 0.72);
        const GROW_WINDOW = 70;
        const waveFront = x0 + (cw + GROW_WINDOW) * Linf;

        ctx.save();
        filtered.forEach(d => {
            const v = CPI_YOY[d.year];
            if (v == null) return;
            const xp = xP(d.year);
            const distFromFront = waveFront - xp;
            const localGrow = Math.max(0, Math.min(1, distFromFront / GROW_WINDOW));
            if (localGrow <= 0) return;
            const grow = easeOut(localGrow);
            const isDeflation = v < 0;
            const tCol = Math.min(1, Math.max(0, v / 12));
            const r = isDeflation ? 90  : 255;
            const g = isDeflation ? 180 : Math.round(180 - 140 * tCol);
            const b = isDeflation ? 255 : Math.round(80  - 80  * tCol);
            const zeroY = yI(0);
            const fullTop = yI(Math.max(v, 0));
            const fullBot = yI(Math.min(v, 0));
            const yTop = zeroY + (fullTop - zeroY) * grow;
            const yBot = zeroY + (fullBot - zeroY) * grow;
            const grd = ctx.createLinearGradient(0, yTop, 0, yBot);
            grd.addColorStop(0, `rgba(${r},${g},${b},${0.55 * 0.92})`);
            grd.addColorStop(1, `rgba(${r},${g},${b},${0.55 * 0.25})`);
            ctx.fillStyle = grd;
            ctx.fillRect(xp - barW/2, yTop, barW, yBot - yTop);
            ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
            ctx.fillRect(xp - barW/2, yTop, barW, 1.5);
        });
        ctx.restore();

        // Right Y axis
        ctx.save();
        ctx.globalAlpha = Linf;
        const axisX = x0 + cw;
        ctx.strokeStyle = '#FF6B35';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(255,107,53,0.4)';
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(axisX, m.top); ctx.lineTo(axisX, y0); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FF8C5A';
        ctx.font = '900 ' + (isMobile ? 12 : 15) + 'px "Arial Black",Arial';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        [0, 5, 10, 15].forEach(pct => {
            const yp = yI(pct);
            ctx.strokeStyle = '#FF8C5A'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(axisX, yp); ctx.lineTo(axisX + 10, yp); ctx.stroke();
            ctx.fillText(pct + '%', axisX + 14, yp);
        });
        ctx.translate(W - 22, m.top + ch/2);
        ctx.rotate(Math.PI/2);
        ctx.fillStyle = 'rgba(255,140,90,0.85)';
        ctx.font = '900 ' + (isMobile ? 11 : 13) + 'px "Arial Black",Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('CPI YoY — ANNUAL INFLATION %', 0, 0);
        ctx.restore();
    }

    // THE GAP — continuous color gradient
    const gapVisible = Math.min(Lg, Lw, Lp);
    if (gapVisible > 0.001 && pGap > 0) {
        const maxGap = Math.max(...filtered.map(d => Math.max(0, d.p - d.w)));
        function interp(yr) {
            if (yr <= filtered[0].year) return filtered[0];
            if (yr >= filtered[filtered.length-1].year) return filtered[filtered.length-1];
            for (let i=0; i<filtered.length-1; i++) {
                if (filtered[i].year <= yr && filtered[i+1].year >= yr) {
                    const t = (yr - filtered[i].year) / (filtered[i+1].year - filtered[i].year);
                    return {
                        w: filtered[i].w + (filtered[i+1].w - filtered[i].w) * t,
                        p: filtered[i].p + (filtered[i+1].p - filtered[i].p) * t,
                    };
                }
            }
            return filtered[filtered.length-1];
        }
        const visibleWidth = cw * easeOut(pGap);
        const SEG = 2;
        for (let px = 0; px < Math.min(cw, visibleWidth); px += SEG) {
            const yr  = minYear + (px / cw) * yearSpan;
            const pt  = interp(yr);
            const gap = Math.max(0, pt.p - pt.w);
            if (gap <= 0) continue;
            const t = maxGap > 0 ? Math.min(1, gap / maxGap) : 0;
            const r = 255;
            const g = Math.round(147 - 147 * t);
            const b = Math.round(26  - 26  * t);
            const ytop = yP(pt.p);
            const ybot = yP(pt.w);
            const segH = ybot - ytop;
            if (segH <= 0) continue;
            const grad = ctx.createLinearGradient(0, ytop, 0, ybot);
            const alpha = (0.15 + t * 0.50) * gapVisible;
            grad.addColorStop(0,   `rgba(${r},${g},${b},${alpha})`);
            grad.addColorStop(0.6, `rgba(${r},${g},${b},${(alpha*0.4).toFixed(3)})`);
            grad.addColorStop(1,   `rgba(${r},${g},${b},${(0.01*gapVisible).toFixed(3)})`);
            ctx.fillStyle = grad;
            ctx.fillRect(x0 + px, ytop, SEG + 1, segH);
        }
    }

    // INFLATIONARY SHOCKS — compact chevrons at top
    if (Lm > 0.001 && pMileston > 0) {
        SHOCKS.forEach((sh, idx) => {
            if (sh.year < minYear || sh.year > maxYear) return;
            const xp = xP(sh.year);
            const shockProg = subProg(idx * 0.04, idx * 0.04 + 0.18, pMileston);
            const op = easeOut(shockProg) * Lm;
            if (op <= 0) return;
            ctx.save();
            ctx.globalAlpha = op;
            const dashShift = (now / 80) % 12;
            ctx.strokeStyle = 'rgba(255,140,0,0.32)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 9]);
            ctx.lineDashOffset = -dashShift;
            ctx.beginPath(); ctx.moveTo(xp, m.top + 26); ctx.lineTo(xp, y0); ctx.stroke();
            ctx.setLineDash([]);
            const chevY = m.top + 12;
            ctx.fillStyle = '#FFB066';
            ctx.beginPath();
            ctx.moveTo(xp, chevY + 7);
            ctx.lineTo(xp - 5, chevY);
            ctx.lineTo(xp + 5, chevY);
            ctx.closePath();
            ctx.shadowColor = '#FF8C00'; ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,176,102,0.9)';
            ctx.font = `900 ${isMobile ? 9 : 11}px "Arial Black",Arial`;
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.save();
            ctx.translate(xp + 4, m.top - 2);
            ctx.rotate(-Math.PI / 4);
            ctx.fillText(`${sh.year} · ${sh.label}`, 0, 0);
            ctx.restore();
            ctx.restore();
        });
    }

    // MILESTONES — auto-stagger pills below shock chevrons
    if (Lm > 0.001 && pMileston > 0) {
        ctx.font = `900 ${isMobile ? 13 : 16}px "Arial Black",Arial`;
        const pillInfo = MILESTONES
            .filter(ms => ms.year >= minYear && ms.year <= maxYear)
            .map(ms => ({ ms, xp: xP(ms.year), w: ctx.measureText(ms.label).width + 20 }));
        const rows = [];
        pillInfo.forEach(p => {
            let row = 0;
            while (rows[row] && rows[row].some(o => Math.abs(o.xp - p.xp) < (o.w + p.w) / 2 + 8)) row++;
            (rows[row] ||= []).push(p);
            p.row = row;
        });
        pillInfo.forEach((p, idx) => {
            const { ms, xp, row } = p;
            const msProg = subProg(idx * 0.06, idx * 0.06 + 0.15, pMileston);
            const slide = easeOut(msProg);
            const verticalOffset = (1 - slide) * -40;
            const opacity = slide * Lm;
            const rowOffsetY = row * 32;
            const MS_PILL_Y_OFFSET = 56;
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.translate(0, verticalOffset);
            ctx.strokeStyle = ms.color;
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8,6]);
            ctx.lineDashOffset = -(now / 60) % 14;
            ctx.globalAlpha = opacity * 0.7;
            ctx.shadowColor = ms.color; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.moveTo(xp, m.top + MS_PILL_Y_OFFSET + 22 + rowOffsetY); ctx.lineTo(xp, y0); ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = opacity;
            ctx.fillStyle = ms.color;
            ctx.font = `900 ${isMobile ? 13 : 16}px "Arial Black",Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            const txt = ms.label;
            const tw = ctx.measureText(txt).width;
            const padX = 10, padY = 5;
            const pillY = m.top + MS_PILL_Y_OFFSET + rowOffsetY;
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(xp - tw/2 - padX, pillY, tw + padX*2, (isMobile?13:16) + padY*2);
            ctx.strokeStyle = ms.color;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(xp - tw/2 - padX, pillY, tw + padX*2, (isMobile?13:16) + padY*2);
            ctx.shadowBlur = 0;
            ctx.fillStyle = ms.color;
            ctx.shadowColor = ms.color; ctx.shadowBlur = 14;
            ctx.fillText(txt, xp, pillY + 4);
            ctx.shadowBlur = 0;
            ctx.restore();
        });
    }

    // Axes
    ctx.save();
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = isMobile ? 3 : 4.5;
    ctx.shadowColor = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 14;
    const axDraw = easeOut(pAxes);
    ctx.beginPath();
    ctx.moveTo(x0, m.top);
    ctx.lineTo(x0, m.top + ch * axDraw);
    if (axDraw >= 1) ctx.lineTo(x0 + cw * axDraw, y0);
    ctx.stroke();
    if (axDraw < 1) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x0 + cw * axDraw, y0);
        ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();

    // Y tick labels
    ctx.save();
    ctx.globalAlpha = pYlabels;
    ctx.fillStyle = '#FFF';
    ctx.font = '900 ' + (isMobile ? 14 : 18) + 'px "Arial Black",Arial';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let v = tickStart; v <= yMax; v += tickStep) {
        const yp = yP(v);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x0-12, yp); ctx.lineTo(x0, yp); ctx.stroke();
        ctx.fillText(String(Math.round(v)), x0-16, yp);
    }
    ctx.restore();

    // X tick labels
    ctx.save();
    ctx.globalAlpha = pXlabels;
    ctx.fillStyle = '#FFF';
    ctx.font = '900 ' + (isMobile ? 13 : 18) + 'px "Arial Black",Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let y = Math.ceil(minYear/xStep)*xStep; y <= maxYear; y += xStep) {
        const xp = xP(y);
        ctx.strokeStyle = '#FFF'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(xp, y0); ctx.lineTo(xp, y0+12); ctx.stroke();
        ctx.fillText(String(y), xp, y0+18);
    }
    ctx.restore();

    // Y-axis label
    ctx.save();
    ctx.globalAlpha = pYlabels;
    ctx.translate(isMobile ? 22 : 28, m.top + ch/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '900 ' + (isMobile ? 12 : 15) + 'px "Arial Black",Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('INDEX  (BASELINE = 100)', 0, 0);
    ctx.restore();

    // DATA LINES
    function drawAnimatedLine(getY, color, lineProg, lineLabel, layerAlpha) {
        if (lineProg <= 0 || layerAlpha <= 0.001) return;
        const draw = easeInOut(lineProg);
        const visYears = (maxYear - minYear) * draw + minYear;
        ctx.save();
        ctx.globalAlpha = layerAlpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = isMobile ? 4 : 5.5;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = color; ctx.shadowBlur = 22;
        ctx.beginPath();
        let lastX = 0, lastY = 0;
        let drawn = false;
        for (let i = 0; i < filtered.length; i++) {
            const d = filtered[i];
            if (d.year > visYears) {
                if (i > 0) {
                    const prev = filtered[i-1];
                    const t = (visYears - prev.year) / (d.year - prev.year);
                    const iy = prev[getY === wAccess ? 'w' : 'p'] + (d[getY === wAccess ? 'w' : 'p'] - prev[getY === wAccess ? 'w' : 'p']) * t;
                    lastX = xP(visYears);
                    lastY = yP(iy);
                    ctx.lineTo(lastX, lastY);
                }
                break;
            }
            const xp = xP(d.year), yp = yP(getY(d));
            if (!drawn) { ctx.moveTo(xp, yp); drawn = true; }
            else ctx.lineTo(xp, yp);
            lastX = xp; lastY = yp;
        }
        ctx.stroke();
        ctx.restore();

        if (lineProg < 1 && lineProg > 0.02) {
            ctx.save();
            ctx.globalAlpha = layerAlpha;
            const glowR = 18 + 6 * Math.sin(performance.now() / 120);
            const grad = ctx.createRadialGradient(lastX, lastY, 0, lastX, lastY, glowR);
            grad.addColorStop(0, '#FFF');
            grad.addColorStop(0.3, color);
            grad.addColorStop(1, color + '00');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(lastX, lastY, glowR, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        if (lineProg >= 1 && pEndDots > 0) {
            const last = filtered[filtered.length-1];
            const xp = xP(last.year), yp = yP(getY(last));
            ctx.save();
            ctx.globalAlpha = pEndDots * layerAlpha;
            const gr = ctx.createRadialGradient(xp,yp,0, xp,yp,16);
            gr.addColorStop(0, color+'FF'); gr.addColorStop(1, color+'00');
            ctx.fillStyle = gr;
            ctx.fillRect(xp-16, yp-16, 32, 32);
            ctx.fillStyle = color;
            ctx.font = '900 ' + (isMobile ? 11 : 13) + 'px "Arial Black",Arial';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
            ctx.fillText(lineLabel, xp + 12, yp);
            ctx.shadowBlur = 0;
            ctx.restore();
        }
    }

    const wAccess = d => d.w;
    const pAccess = d => d.p;
    if (Lw > 0.001) drawAnimatedLine(wAccess, '#FFFFFF', pWages, 'WAGES', Lw);
    if (Lp > 0.001) drawAnimatedLine(pAccess, '#F7931A', pProd, 'PRODUCTIVITY', Lp);

    // Ghost title — above x-axis
    ctx.save();
    const titleAlpha = animActive ? pTitle * 0.22 : 0.22;
    const chartCxAdj = isMobile ? W/2 : m.left + (W - m.left - m.right)/2;
    const titleFontSize = Math.min(78, Math.round((W - m.left - m.right) / 11));
    const subTitleFontSize = Math.min(34, Math.round((W - m.left - m.right) / 30));
    const titleBlockBottom = y0 - 30;
    const titleY    = titleBlockBottom - subTitleFontSize - 12;
    const subTitleY = titleBlockBottom;
    ctx.font = '900 ' + titleFontSize + 'px "Arial Black",Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(247,147,26,${titleAlpha})`;
    ctx.fillText('THE GREAT DIVERGENCE', chartCxAdj, titleY);
    ctx.font = '900 ' + subTitleFontSize + 'px "Arial Black",Arial';
    ctx.fillStyle = `rgba(255,255,255,${titleAlpha * 0.7})`;
    ctx.fillText('1948 — 2024', chartCxAdj, subTitleY);
    ctx.restore();

    // HOVER
    if (!animActive) {
        const inChart = (mx >= x0 && mx <= x0+cw && my >= m.top && my <= y0);
        const tt = document.getElementById('tooltip');
        if (inChart) {
            const yrAtMouse = minYear + (mx - x0) / cw * yearSpan;
            let snap = filtered[0];
            for (const d of filtered) {
                if (Math.abs(d.year - yrAtMouse) < Math.abs(snap.year - yrAtMouse)) snap = d;
            }
            const xSnap = xP(snap.year);
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4,4]);
            ctx.beginPath(); ctx.moveTo(xSnap, m.top); ctx.lineTo(xSnap, y0); ctx.stroke();
            ctx.restore();

            const lines = [];
            if (Lw > 0.05) lines.push({v: snap.w, color:'#FFF'});
            if (Lp > 0.05) lines.push({v: snap.p, color:'#F7931A'});
            lines.forEach(({v, color}) => {
                const yp = yP(v);
                ctx.save();
                ctx.fillStyle = color;
                ctx.shadowColor = color; ctx.shadowBlur = 22;
                ctx.beginPath(); ctx.arc(xSnap, yp, 8, 0, Math.PI*2); ctx.fill();
                ctx.restore();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(xSnap, yp, 8, 0, Math.PI*2); ctx.stroke();
            });

            const gap  = snap.p - snap.w;
            const note = NOTES[snap.year] || '';
            const cpiVal = CPI_YOY[snap.year];
            tt.innerHTML =
                `<div class="tt-year">${snap.year}</div>` +
                (S.show1 ? `<div class="tt-row"><span class="tt-key">Wages</span><span class="tt-val">${snap.w.toFixed(1)}</span></div>` : '') +
                (S.show2 ? `<div class="tt-row"><span class="tt-key">Productivity</span><span class="tt-val">${snap.p.toFixed(1)}</span></div>` : '') +
                (S.show5 && cpiVal != null ?
                    `<div class="tt-row"><span class="tt-key">CPI YoY</span><span class="tt-val" style="color:#FF8C5A;">${cpiVal >= 0 ? '+' : ''}${cpiVal.toFixed(1)}%</span></div>` : '') +
                (S.show3 && S.show1 && S.show2 ?
                    `<div class="tt-gap-row"><span class="tt-gap">Gap: ${gap >= 0 ? '+' : ''}${gap.toFixed(1)}</span></div>` : '') +
                (note ? `<div class="tt-note">${note}</div>` : '');

            const ttW = 280, ttH = tt.offsetHeight || 200;
            let tx = mx + 18, ty = my - ttH/2;
            if (tx + ttW > W - 20) tx = mx - ttW - 18;
            ty = Math.max(10, Math.min(ty, H - ttH - 10));
            tt.style.left = tx + 'px';
            tt.style.top  = ty + 'px';
            tt.classList.add('show');
        } else {
            tt.classList.remove('show');
        }
    } else {
        document.getElementById('tooltip').classList.remove('show');
    }

    // Statistics
    const f0 = filtered[0], fN = filtered[filtered.length-1];
    const wDelta = ((fN.w - f0.w) / f0.w * 100);
    const pDelta = ((fN.p - f0.p) / f0.p * 100);
    const gapPts = (fN.p - fN.w) - (f0.p - f0.w);
    document.getElementById('s1').textContent = (wDelta>=0?'+':'') + wDelta.toFixed(0) + '%';
    document.getElementById('s2').textContent = (pDelta>=0?'+':'') + pDelta.toFixed(0) + '%';
    document.getElementById('s3').textContent = (gapPts>=0?'+':'') + gapPts.toFixed(0) + 'pts';
    document.getElementById('s4').textContent = S.y2 - S.y1;
}

function loop() { draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
